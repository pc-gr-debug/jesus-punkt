<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gästeliste — Hochzeit</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preload" href="/hochzeit-feier/fonts/great-vibes-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/hochzeit-feier/style.css?v=2" />
  <link rel="stylesheet" href="/hochzeit-feier/admin/admin.css" />
</head>
<body>
  <main class="page">
    <section class="card card--wide">
      <h1>Gästeliste</h1>

      <form id="login-form" class="rsvp-form">
        <label class="field">
          <span>Passwort</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <p id="login-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn--primary">Anmelden</button>
      </form>

      <div id="guest-list" hidden>
        <p class="total-count">Gesamt: <span id="total-count">0</span></p>
        <button type="button" id="export-pdf" class="btn btn--outline">Als PDF exportieren</button>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Zeitpunkt</th>
              </tr>
            </thead>
            <tbody id="guest-rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="/hochzeit-feier/admin/admin.js"></script>
</body>
</html>
